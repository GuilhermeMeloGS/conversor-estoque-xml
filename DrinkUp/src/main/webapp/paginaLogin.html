<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drink Up | Entrar</title>

    <!-- Fonte Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="paginaLogin.css">
</head>

<body>
    <!-- LADO ESQUERDO - IMAGEM -->
    <section class="login-banner">
        <img class="imagemLogin" src="imagensHtml/imagemPaginaLogin.jpeg" alt="Imagem da tela de login">
    </section>

    <!-- LADO DIREITO - FORMULÁRIO -->
    <section class="area-login">
        <div class="login-box">
            <h1>Entrar</h1>

            <form action="#" method="post">

                <div class="info-forms">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Insira seu Email" required>
                </div>

                <div class="info-forms">
                    <label for="senha">Senha</label>
                    <div class="senha-box">
                        <input type="password" id="senha" name="senha" placeholder="Insira sua Senha" required>
                    </div>
                </div>

                <div class="opcoes-forms">
                    <label class="remember">
                        <input type="checkbox" name="lembrar">
                        <span>Lembre-se</span>
                    </label>
                    <a href="#" class="esqueceu-senha">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="botao-login">Entrar</button>

            </form>

            <p class="cadastro">
                <a href="#" class="link-amarelo">Não tem conta ainda? Cadastre-se</a>
            </p>
        </div>
    </section>
</body>

</html>
