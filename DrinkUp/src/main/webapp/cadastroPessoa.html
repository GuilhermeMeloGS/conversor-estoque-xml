<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkUp | Cadastrar</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="cadastroPessoa.css">
</head>

<body>
    <header class="cabecalho">
        <a href="index.html#inicio" class="logo" aria-label="Página inicial DrinkUp">
            <img src="imagensHtml/logoDrinkUp.png" alt="Logo Drink Up" class="logo-imagem">
        </a>

        <nav class="navegacao" aria-label="Menu principal">
            <a href="index.html#categorias">Cervejas</a>
            <a href="index.html#categorias">Refrigerantes</a>
            <a href="index.html#produtos">Combos</a>
            <a href="index.html#ofertas" class="destaque">Ofertas</a>
        </nav>

        <div class="acoes-cabecalho">
            <a href="paginaLogin.html" class="botao-cabecalho botao-login-cabecalho">Entrar</a>
            <a href="index.html#carrinho" class="botao-cabecalho">🛒 Carrinho</a>
        </div>
    </header>

    <main class="cadastro-pessoa-main">
        <section class="cartao-cadastro-pessoa" aria-labelledby="titulo-cadastro">
            <h1 id="titulo-cadastro">Cadastrar</h1>

            <form action="#" method="post" class="formulario-pessoa">
                <div class="campos-nome">
                    <div class="campo-pessoa">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome"
                               autocomplete="given-name" required>
                    </div>

                    <div class="campo-pessoa">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome"
                               autocomplete="family-name" required>
                    </div>
                </div>

                <div class="campo-pessoa">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com"
                           autocomplete="email" required>
                </div>

                <div class="campo-pessoa">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha"
                           autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" class="botao-cadastrar-pessoa">Cadastrar</button>
            </form>

            <p class="link-login-pessoa">
                Já tem uma conta? <a href="paginaLogin.html">Entrar</a>
            </p>
        </section>
    </main>
</body>

</html>
