<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrinkUp | Cadastrar bebida</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="cadastroBebida.css">
</head>

<body>
<header class="cabecalho">
    <a href="index.html#inicio" class="logo" aria-label="Página inicial DrinkUp">
        <img src="imagensHtml/logoDrinkUp.png" alt="Logo Drink Up" class="logo-imagem">
    </a>

    <nav class="navegacao" aria-label="Menu principal"></nav>

    <div class="acoes-cabecalho">
        <a href="paginaLogin.html" class="botao-cabecalho botao-login-cabecalho">Entrar</a>
        <a href="index.html#carrinho" class="botao-cabecalho">🛒 Carrinho</a>
    </div>
</header>

<main class="pagina-cadastro">
    <div class="cabecalho-pagina">
        <a href="produtos" class="voltar" aria-label="Voltar para a listagem">&larr;</a>
        <div>
            <h1 id="titulo-pagina">Nova bebida</h1>
            <p id="subtitulo-pagina">Adicione uma nova bebida ao catálogo.</p>
        </div>
    </div>

    <!-- A rota muda para /produtos/atualizar ao editar um produto. -->
    <form class="formulario-cadastro" action="produtos/cadastrar" method="post" enctype="multipart/form-data">

        <!-- Campo oculto para carregar o ID caso seja edição -->
        <input type="hidden" name="id" id="id">

        <section class="painel-formulario" aria-labelledby="titulo-informacoes">
            <div class="titulo-painel">
                <h2 id="titulo-informacoes">Informações básicas</h2>
                <p>Preencha os dados principais do produto.</p>
            </div>

            <div class="campos-produto">
                <div class="campo campo-largo">
                    <label for="nome">Nome da bebida <span aria-hidden="true">*</span></label>
                    <input type="text" id="nome" name="nome" placeholder="Ex.: Coca-Cola lata 350 ml" required>
                </div>

                <div class="campo">
                    <label for="codigoDeBarras">Código de barras <span aria-hidden="true">*</span></label>
                    <input type="text" id="codigoDeBarras" name="codigoDeBarras" placeholder="Ex.: 7891234567890" required>
                </div>

                <div class="campo">
                    <label for="idCategoria">Categoria <span aria-hidden="true">*</span></label>
                    <select id="idCategoria" name="idCategoria" required>
                        <option value="" selected disabled>Selecione uma categoria</option>
                    </select>
                </div>

                <div class="campo campo-largo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva a bebida, o sabor, a embalagem e outras informações"></textarea>
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$) <span aria-hidden="true">*</span></label>
                    <input type="number" id="preco" name="preco" min="0" step="0.01" placeholder="0,00" required>
                </div>

                <div class="campo">
                    <label for="quantidadeEstoque">Quantidade em estoque <span aria-hidden="true">*</span></label>
                    <input type="number" id="quantidadeEstoque" name="quantidadeEstoque" min="0" step="1" placeholder="Ex.: 24" required>
                </div>

                <div class="campo">
                    <label for="volumeML">Volume (ml) <span aria-hidden="true">*</span></label>
                    <input type="number" id="volumeML" name="volumeML" min="1" step="1" placeholder="Ex.: 350" required>
                </div>
            </div>
        </section>

        <aside class="painel-imagem" aria-labelledby="titulo-imagem">
            <div class="titulo-painel">
                <h2 id="titulo-imagem">Imagem do produto</h2>
                <p>Escolha uma foto para o catálogo.</p>
            </div>

            <div class="area-upload">
                <span class="icone-upload" aria-hidden="true">↑</span>
                <p>Selecione uma imagem do produto</p>
                <span class="formatos-imagem">Formatos aceitos: PNG, JPG ou WebP</span>
                <label class="botao-upload" for="imagem">Escolher imagem</label>
                <input type="file" id="imagem" name="imagem" accept="image/png,image/jpeg,image/webp">
                <img id="previaImagem" class="previa-imagem" alt="Prévia da imagem do produto" hidden>
                <span class="formatos-imagem" id="avisoImagem"></span>
            </div>
        </aside>

        <div class="acoes-formulario">
            <a href="produtos" class="botao-cancelar">Cancelar</a>
            <button type="submit" id="botao-enviar" class="botao-salvar">Cadastrar bebida</button>
        </div>
    </form>
</main>

<!-- Carrega categorias (e, no modo edição, o produto) direto do banco -->
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const formulario = document.querySelector('.formulario-cadastro');
    const selectCategoria = document.getElementById('idCategoria');

    async function carregar() {
        const categorias = await (await fetch('api/categorias')).json();
        categorias.forEach(c => {
            const opcao = document.createElement('option');
            opcao.value = c.id;
            opcao.textContent = c.nome;
            selectCategoria.appendChild(opcao);
        });

        if (!id) return;

        formulario.action = 'produtos/atualizar';
        document.getElementById('titulo-pagina').innerText = "Editar bebida";
        document.getElementById('subtitulo-pagina').innerText = "Altere os dados do produto no catálogo.";
        document.getElementById('botao-enviar').innerText = "Salvar alterações";

        const resposta = await fetch('api/produto?id=' + encodeURIComponent(id));
        if (!resposta.ok) {
            alert('Produto não encontrado.');
            window.location.href = 'produtos';
            return;
        }
        const p = await resposta.json();

        document.getElementById('id').value = p.id;
        document.getElementById('nome').value = p.nome;
        document.getElementById('codigoDeBarras').value = p.codigoDeBarras;
        selectCategoria.value = p.idCategoria;
        document.getElementById('descricao').value = p.descricao;
        document.getElementById('preco').value = p.preco;
        document.getElementById('quantidadeEstoque').value = p.estoque;
        document.getElementById('volumeML').value = p.volumeML;

        mostrarPrevia(p.imagem);
        if (p.temFoto) {
            document.getElementById('avisoImagem').textContent =
                'Imagem atual mantida, a menos que você escolha outra.';
        }
    }

    const LIMITE_IMAGEM = 2 * 1024 * 1024;
    const inputImagem = document.getElementById('imagem');

    function mostrarPrevia(src) {
        const previa = document.getElementById('previaImagem');
        previa.src = src;
        previa.hidden = false;
    }

    inputImagem.addEventListener('change', function () {
        const arquivo = this.files[0];
        if (!arquivo) return;

        if (arquivo.size > LIMITE_IMAGEM) {
            alert('A imagem deve ter no máximo 2 MB.');
            this.value = '';
            return;
        }
        document.getElementById('avisoImagem').textContent = arquivo.name;
        mostrarPrevia(URL.createObjectURL(arquivo));
    });

    // Erros do servidor (ex.: arquivo inválido) aparecem sem sair do formulário.
    formulario.addEventListener('submit', async function (e) {
        e.preventDefault();
        const botao = document.getElementById('botao-enviar');
        botao.disabled = true;
        try {
            const resposta = await fetch(formulario.action, { method: 'POST', body: new FormData(formulario) });
            if (resposta.ok) {
                window.location.href = 'produtos';
                return;
            }
            const dados = await resposta.json().catch(() => ({}));
            alert(dados.erro || 'Não foi possível salvar o produto. Verifique se o código de barras já existe.');
        } catch {
            alert('Erro de comunicação com o servidor.');
        } finally {
            botao.disabled = false;
        }
    });

    carregar().catch(() => alert('Não foi possível carregar os dados do banco.'));
</script>
<script src="shared/menu.js"></script>
</body>

</html>
